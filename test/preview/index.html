<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Constelação da Apoteose — pré-visualização do canvas</title>
  <link rel="stylesheet" href="/styles/constelacao.css">
  <style>
    body { margin: 0; background: #0b0a1f; color: #f5f3ff; font-family: system-ui, sans-serif; }
    .constelacao-apoteose { display: grid; grid-template-columns: 1fr 260px; gap: 8px; height: 100vh; padding: 8px; box-sizing: border-box; }
    #side { display: flex; flex-direction: column; gap: 6px; }
    #log { flex: 1; overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
  <div class="constelacao-apoteose">
    <section class="constelacao-canvas-placeholder"><div id="canvas" class="constelacao-canvas-container"></div></section>
    <aside id="side" class="constelacao-panel">
      <button data-mode="select">Selecionar</button>
      <button data-mode="create">Criar</button>
      <button data-mode="connect">Conectar</button>
      <button data-mode="remove">Remover</button>
      <button id="unlock">Alternar desbloqueio (selecionado)</button>
      <button id="reveal">Alternar revelado (selecionado)</button>
      <button id="fit">Enquadrar</button>
      <pre id="log"></pre>
    </aside>
  </div>
  <!-- Globais que a página do Foundry define antes do foundry.mjs (modo ?foundry) -->
  <script>const SIGNED_EULA = true; const ROUTE_PREFIX = ''; const MESSAGES = null;</script>
  <!-- PIXI 7.4.3, a mesma versão do Foundry 14.364 -->
  <script src="__PIXI_URL__"></script>
  <script type="module">
    if (new URLSearchParams(location.search).has('foundry')) {
      // Mesma sequência de scripts da página do Foundry (o PIXI já veio acima).
      const scripts = ['jquery.min.js', 'handlebars.min.js', 'handlebars-intl.min.js', 'particle-emitter.min.js',
        'pixi-graphics-smooth.js', 'clipper/clipper.js', 'earcut-edges/earcut-edges.js', 'showdown.js', 'spark-md5.min.js'];
      for (const name of scripts) {
        await new Promise((resolve) => {
          const script = document.createElement('script');
          script.src = `/scripts/${name}`;
          script.onload = script.onerror = resolve;
          document.head.appendChild(script);
        });
      }
      try { await import('/scripts/foundry.mjs'); } catch (error) { console.warn('foundry.mjs:', error); }
      // Como o canvas da cena faz ao inicializar: troca o plugin "batch" do
      // PIXI pelos do Foundry, que passam a valer para todo renderizador.
      if (new URLSearchParams(location.search).has('plugins')) {
        globalThis.canvas = { performance: { mode: 2 } };
        const shaders = foundry.canvas.rendering.shaders;
        shaders.BaseSamplerShader.registerPlugin({ force: true });
        shaders.OccludableSamplerShader.registerPlugin();
        shaders.DepthSamplerShader.registerPlugin();
        PIXI.extensions.remove(PIXI.AccessibilityManager);
      }
    }
    await import('/test/.out/preview.js');
  </script>
</body>
</html>
